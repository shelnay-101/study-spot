<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | StudySpot</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="site-header"></div>
  <main>
    <div class="auth-wrap"><div class="auth">
      <h1>Create account</h1><p class="muted">Sign up with your university email and a password.</p>
      <div id="msg" class="alert" role="alert" hidden></div>
      <form id="register-form">
        <div class="field"><label for="email">University email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required><span class="hint">At least 6 characters.</span></div>
        <div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
        <button class="btn btn-gold btn-block" type="submit">Sign up</button>
      </form>
      <p class="auth-alt">Already have an account? <a href="/pages/login.html">Log in</a></p>
    </div></div>
  </main>
  <div id="site-footer"></div>
  <script type="module" src="/js/pages/register.js"></script>
</body>
</html>
